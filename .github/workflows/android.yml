name: Verify and publish Android artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve project version
        id: version
        if: github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 .github/scripts/resolve-publish-version.py
      - uses: ./.github/actions/setup-android
      - name: Verify Android modules and stage publications
        run: ./gradlew --no-daemon androidCheck publishAllPublicationsToStagingRepository --console=plain
      - name: Verify publication metadata and isolated integration
        run: |
          python3 tools/check-publications.py
          python3 tools/published-consumer-test.py --repository build/staging-repository

  publish:
    needs: verify
    if: github.repository == 'ytlog/android-compose-hotreload' && github.ref == 'refs/heads/main' && needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: maven-central
    concurrency:
      group: maven-central-${{ needs.verify.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check whether the version is already published
        id: availability
        env:
          PROJECT_VERSION: ${{ needs.verify.outputs.version }}
        run: python3 tools/check-publications.py --central-availability "$PROJECT_VERSION"
      - uses: ./.github/actions/setup-android
      - name: Publish the libraries and plugin marker
        if: steps.availability.outputs.available == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword \
                      ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing publishing secret for $name"
              exit 1
            fi
          done
          ./gradlew --no-daemon publishAndReleaseToMavenCentral -PenableMavenCentral=true --console=plain
      - name: Verify public version-based integration
        run: python3 tools/published-consumer-test.py
