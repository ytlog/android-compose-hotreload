[versions]
kotlin = "2.3.21"
agp = "8.11.1"
upstream = "1.3.0-alpha+225"
compose = "1.11.1"
composeBom = "2026.06.01"
activityCompose = "1.12.4"
artDcevm = "0.1.0-alpha.4"
coroutines = "1.11.0"
asm = "9.10.1"
javassist = "3.30.2-GA"
r8 = "8.13.25"
junit = "4.13.2"
compileSdk = "37"
minSdk = "30"
targetSdk = "36"
ndk = "27.2.12479018"
cmake = "3.22.1"

[libraries]
upstream-agent = { module = "org.jetbrains.compose.hot-reload:hot-reload-agent", version.ref = "upstream" }
upstream-analysis = { module = "org.jetbrains.compose.hot-reload:hot-reload-analysis", version.ref = "upstream" }
upstream-core = { module = "org.jetbrains.compose.hot-reload:hot-reload-core", version.ref = "upstream" }
upstream-orchestration = { module = "org.jetbrains.compose.hot-reload:hot-reload-orchestration", version.ref = "upstream" }
upstream-gradlePlugin = { module = "org.jetbrains.compose.hot-reload:hot-reload-gradle-plugin", version.ref = "upstream" }
compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose" }
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
asm-core = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm-analysis = { module = "org.ow2.asm:asm-analysis", version.ref = "asm" }
javassist = { module = "org.javassist:javassist", version.ref = "javassist" }
r8 = { module = "com.android.tools:r8", version.ref = "r8" }
junit = { module = "junit:junit", version.ref = "junit" }
artDcevm = { module = "io.github.ytlog:artdcevm", version.ref = "artDcevm" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
